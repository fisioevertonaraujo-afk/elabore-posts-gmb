<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elabore - Gerador de Posts GMB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div class="max-w-4xl mx-auto p-6">
    
    <!-- Cabeçalho -->
    <header class="flex items-center justify-between pb-6 mb-8 border-b border-slate-800">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
          <span class="text-emerald-400">⚡</span> Elabore Post Creator
        </h1>
        <p class="text-sm text-slate-400">Gerador inteligente de postagens com visão computacional para GMB</p>
      </div>
      <div class="px-3 py-1 bg-slate-800 border border-slate-700 rounded-full text-xs text-slate-300">
        Google AI Studio
      </div>
    </header>

    <!-- Formulário Principal -->
    <div class="bg-slate-800/80 border border-slate-700 rounded-2xl p-6 mb-8 shadow-xl">
      
      <!-- Seleção de Cliente -->
      <div class="mb-6">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
          1. Selecione o Cliente
        </label>
        <select id="clientSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition">
          <option value="">Carregando clientes...</option>
        </select>
      </div>

      <!-- Resumo do Perfil Selecionado -->
      <div id="clientMeta" class="hidden mb-6 p-4 bg-slate-900/60 border border-slate-750 rounded-xl text-xs text-slate-400 grid grid-cols-2 gap-2">
        <!-- Injetado dinamicamente -->
      </div>

      <!-- Inserção de Links das Imagens -->
      <div class="mb-6">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
          2. Links das Imagens (Google Drive ou Web)
        </label>
        <div id="linksContainer" class="space-y-3">
          <div class="flex gap-2">
            <input type="text" placeholder="Cole o link da foto no Google Drive..." class="image-link flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition text-sm">
          </div>
        </div>
        <button id="addLinkBtn" class="mt-3 text-xs text-emerald-400 hover:text-emerald-300 font-semibold flex items-center gap-1">
          <i class="fa-solid fa-plus"></i> Adicionar outra foto (Post em lote)
        </button>
      </div>

      <!-- Botão Gerar -->
      <button id="generateBtn" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-4 rounded-xl shadow-lg hover:shadow-emerald-500/20 transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Analisar Imagens & Gerar Posts
      </button>
    </div>

    <!-- Feedback de Carregamento -->
    <div id="loader" class="hidden text-center py-12">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-slate-700 border-t-emerald-400 mb-3"></div>
      <p class="text-sm text-slate-400">Analisando mídia e escrevendo copies otimizadas...</p>
    </div>

    <!-- Resultados Gerados -->
    <div id="results" class="space-y-6"></div>

  </div>

  <script>
    // Base de Clientes extraída da planilha
    const CLIENTS = [
      {
        id: "CLI004",
        nome: "Rafaela Bernardes",
        segmento: "Saúde e bem estar",
        cidade: "São Caetano do Sul",
        bairro: "Barcelona",
        servicos: "Quiropraxia",
        categoria: "Clínica de quiropraxia",
        keywords: ["Quiropraxia", "quiropraxista", "dor lombar", "disfunção temporo mandibular", "bruxismo"],
        tom: "Profissional e informativo",
        restricoes: "",
        cta: "Saiba mais",
        obs: ""
      },
      {
        id: "CLI011",
        nome: "Fernag Papelaria",
        segmento: "Papelaria e gráfica rápida",
        cidade: "São Paulo",
        bairro: "Jardim Fongaro",
        servicos: "Impressão de documentos, cópias, encadernação, plastificação",
        categoria: "Papelaria",
        keywords: ["impressão de documentos", "cópias / xerox perto de mim", "encadernação", "plastificação de documentos", "papelaria Jardim Fongaro"],
        tom: "Direto, prático, foco em autoridade e resolução rápida",
        restricoes: "Sem travessão ou hífen como conector, sem link, telefone ou preço na descrição, sem promessa de resultado, sem palavra-chave forçada no nome do perfil",
        cta: "Saiba mais",
        obs: ""
      },
      {
        id: "CLI013",
        nome: "Legend Garage",
        segmento: "Automotivo",
        cidade: "São Paulo",
        bairro: "Mooca",
        servicos: "Estética automotiva (lavagem, higienização, polimento, vitrificação, vidros, faróis, plásticos), aplicação de película automotiva, funilaria e pintura automotiva",
        categoria: "Serviço de limpeza completa de automóveis",
        keywords: ["Estética automotiva", "Polimento", "Aplicação de película", "Vitrificação", "Funilaria e pintura"],
        tom: "Direto, técnico, foco em autoridade, sem enrolação",
        restricoes: "Descrição sem travessão/hífen, sem link, telefone ou preço, sem promessa de leads/clientes/vendas, não mostrar placas visíveis",
        cta: "Saiba mais",
        obs: "Peso de SEO e conteúdo deve priorizar estética automotiva de alto padrão."
      },
      {
        id: "CLI008",
        nome: "Elabore Produtora",
        segmento: "Marketing",
        cidade: "São Caetano do Sul",
        bairro: "Barcelona",
        servicos: "Marketing para negócios locais",
        categoria: "Agência de Marketing",
        keywords: ["Marketing local", "Google Meu Negócio", "Gestão de tráfego"],
        tom: "Estratégico e direto",
        restricoes: "",
        cta: "Saiba mais",
        obs: ""
      }
    ];

    const clientSelect = document.getElementById('clientSelect');
    const clientMeta = document.getElementById('clientMeta');
    const linksContainer = document.getElementById('linksContainer');
    const addLinkBtn = document.getElementById('addLinkBtn');
    const generateBtn = document.getElementById('generateBtn');
    const loader = document.getElementById('loader');
    const results = document.getElementById('results');

    // Popular Select
    clientSelect.innerHTML = '<option value="">Selecione um cliente...</option>' + 
      CLIENTS.map(c => `<option value="${c.id}">${c.nome} (${c.cidade} - ${c.bairro})</option>`).join('');

    clientSelect.addEventListener('change', (e) => {
      const client = CLIENTS.find(c => c.id === e.target.value);
      if (client) {
        clientMeta.classList.remove('hidden');
        clientMeta.innerHTML = `
          <div><strong>Segmento:</strong> ${client.segmento}</div>
          <div><strong>Local:</strong> ${client.bairro}, ${client.cidade}</div>
          <div class="col-span-2"><strong>Palavras-chave:</strong> ${client.keywords.join(', ')}</div>
          ${client.restricoes ? `<div class="col-span-2 text-amber-400"><strong>Restrições:</strong> ${client.restricoes}</div>` : ''}
        `;
      } else {
        clientMeta.classList.add('hidden');
      }
    });

    // Adicionar mais links de fotos
    addLinkBtn.addEventListener('click', () => {
      const div = document.createElement('div');
      div.className = 'flex gap-2';
      div.innerHTML = `
        <input type="text" placeholder="Cole o link de outra foto..." class="image-link flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition text-sm">
        <button type="button" class="text-slate-500 hover:text-rose-400 px-2" onclick="this.parentElement.remove()">✕</button>
      `;
      linksContainer.appendChild(div);
    });

    // Processamento
    generateBtn.addEventListener('click', async () => {
      const clientId = clientSelect.value;
      if (!clientId) return alert('Selecione um cliente.');

      const client = CLIENTS.find(c => c.id === clientId);
      const inputs = Array.from(document.querySelectorAll('.image-link'));
      const links = inputs.map(i => i.value.trim()).filter(Boolean);

      if (links.length === 0) return alert('Adicione pelo menos um link de imagem.');

      loader.classList.remove('hidden');
      results.innerHTML = '';

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ client, imageUrls: links })
        });

        const data = await response.json();
        loader.classList.add('hidden');

        if (!data.success) throw new Error(data.message || 'Erro ao processar.');

        data.posts.forEach((post, idx) => {
          const card = document.createElement('div');
          card.className = 'bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl';
          
          const isWarning = post.statusSeguranca.toLowerCase().includes('atenção') || post.statusSeguranca.toLowerCase().includes('risco');
          const badgeClass = isWarning ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';

          card.innerHTML = `
            <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-750">
              <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Postagem #${idx + 1}</span>
              <span class="px-3 py-1 rounded-full text-xs font-semibold border ${badgeClass}">
                ${post.statusSeguranca}
              </span>
            </div>
            
            ${post.alertaDetalhado ? `<div class="mb-4 text-xs text-amber-300 bg-amber-950/40 border border-amber-800/60 p-3 rounded-xl"><i class="fa-solid fa-triangle-exclamation mr-1"></i> ${post.alertaDetalhado}</div>` : ''}

            <div class="bg-slate-900 rounded-xl p-4 text-slate-200 text-sm whitespace-pre-wrap leading-relaxed font-sans mb-4 border border-slate-750" id="copyText_${idx}">${post.textoPost}</div>

            <div class="flex justify-end">
              <button onclick="copiarTexto('copyText_${idx}', this)" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold py-2.5 px-4 rounded-xl transition flex items-center gap-2">
                <i class="fa-regular fa-copy"></i> Copiar Texto
              </button>
            </div>
          `;
          results.appendChild(card);
        });

      } catch (err) {
        loader.classList.add('hidden');
        alert('Erro ao gerar postagens: ' + err.message);
      }
    });

    function copiarTexto(elementId, btn) {
      const text = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(text).then(() => {
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check text-emerald-400"></i> Copiado!';
        setTimeout(() => btn.innerHTML = originalHtml, 2000);
      });
    }
  </script>
</body>
</html>
